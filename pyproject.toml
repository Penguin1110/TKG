[project]
name = "tkg-temporal-wikipedia-explorer"
version = "0.18.0"
description = "Renewable cutoff-relative multi-hop navigation over Wikipedia revisions"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "llm",
    "temporal-knowledge",
    "wikipedia",
    "graph-navigation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Penguin1110/TKG"
Repository = "https://github.com/Penguin1110/TKG.git"
Issues = "https://github.com/Penguin1110/TKG/issues"

[project.scripts]
tkg-generate-cases = "tkg.experiment.question_generation:main"
tkg-generate-multihop = "tkg.experiment.multihop_generation:main"
tkg-discover-temporal-candidates = "tkg.experiment.temporal_candidate_discovery:main"
tkg-profile-temporal-relations = "tkg.experiment.temporal_relation_profiler:main"
tkg-renew-relation-registry = "tkg.experiment.temporal_relation_renewal:main"
tkg-renew-questions = "tkg.experiment.renewable_question_engine:main"
tkg-run = "tkg.experiment.temporal_runner:main"
tkg-create-review-template = "tkg.experiment.human_review:main"
tkg-compare-candidate-sources = "tkg.experiment.candidate_source_comparison:main"
tkg-generate-candidate-batch = "tkg.experiment.candidate_question_batch:main"
tkg-promote-candidate-seeds = "tkg.experiment.candidate_seed_promotion:main"
tkg-resume-machine-validation = "tkg.experiment.resumable_machine_validation_v24:main"
tkg-curate-ready-candidates = "tkg.experiment.ready_candidate_curation_v27:main"
tkg-expand-certified-spine-tails = "tkg.experiment.certified_spine_tail_expansion_v27:main"
tkg-plan-spine-pk = "tkg.experiment.spine_pk_reuse_v27:main"
tkg-open-weight-independent-gate = "tkg.experiment.open_weight_independent_gate_v24:main"
tkg-run-temporal-beam = "tkg.experiment.temporal_beam_runner:main"
tkg-run-forced-diagnostics = "tkg.experiment.temporal_beam_diagnostics:main"
tkg-replay-temporal-eval-v2 = "tkg.experiment.temporal_eval_v2_replay:main"
tkg-generate-temporal-eval-v2-synthetic = "tkg.experiment.temporal_eval_v2_synthetic:main"
tkg-snapshot = "tkg.wikipedia.snapshot:main"
tkg-validate-cases = "tkg.experiment.case_validation:main"
tkg-validate-judge = "tkg.judging.validation:main"
tkg-visualize = "tkg.visualization.server:main"

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pyflakes>=3.2,<4",
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev"]
package = true

[tool.uv.workspace]
members = []

[tool.hatch.build.targets.wheel]
packages = ["src/tkg"]

[tool.hatch.build.targets.sdist]
include = [
    "/.env.example",
    "/README.md",
    "/examples",
    "/judge_gold.example.jsonl",
    "/legacy",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/uv.lock",
]

[tool.pytest.ini_options]
minversion = "8.3"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
files = ["src/tkg"]
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
